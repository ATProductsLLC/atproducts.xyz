<script>
/* ---- PAUSE: freezes sim, timers, audio and input ---- */
let gamePaused=false;
(function(){
const nst=window.setTimeout.bind(window),nct=window.clearTimeout.bind(window),timers=new Map();let nid=1e6;
window.setTimeout=function(fn,ms,...a){
  if(typeof fn!=="function")return nst(fn,ms,...a);
  const id=nid++,t={ms:+ms||0,start:performance.now(),h:0};
  t.fn=()=>{timers.delete(id);fn(...a)};
  t.h=gamePaused?0:nst(t.fn,t.ms);
  timers.set(id,t);return id};
window.clearTimeout=function(id){const t=timers.get(id);if(t){nct(t.h);timers.delete(id)}else nct(id)};
function setPaused(p){
  if(p===gamePaused)return;
  const now=performance.now();gamePaused=p;
  if(p){
    timers.forEach(t=>{nct(t.h);t.ms=Math.max(0,t.ms-(now-t.start))});
    try{for(const k in keys)keys[k]=0}catch(e){}
    try{if(AC&&AC.state==="running")AC.suspend()}catch(e){}
  }else{
    timers.forEach(t=>{t.start=now;t.h=nst(t.fn,t.ms)});
    try{if(AC&&AC.state==="suspended")AC.resume()}catch(e){}
  }
  document.body.classList.toggle("paused",p);
  const o=document.getElementById("pauseov"),b=document.getElementById("pz");
  if(o)o.style.display=p?"flex":"none";
  if(b)b.textContent=p?"\u25B6":"\u23F8";
}
window.togglePause=()=>setPaused(!gamePaused);
addEventListener("keydown",e=>{
  const k=e.key;
  if(k==="p"||k==="P"||k==="Escape"){
    if(e.repeat){e.stopImmediatePropagation();e.preventDefault();return}
    if(k==="Escape"&&!gamePaused)return;          /* Esc only resumes */
    e.stopImmediatePropagation();e.preventDefault();togglePause();return}
  if(gamePaused){e.stopImmediatePropagation();e.preventDefault()}
},true);
addEventListener("blur",()=>{try{if(!window.noAP&&!gamePaused&&document.getElementById("over").style.display!=="flex")setPaused(true)}catch(e){}});
})();
</script>
<script>
const N=8,T=2.1,CROPS={wheat:{t:25,cost:3,sell:9,c:0xe8c040,ic:"🌾"},carrot:{t:40,cost:8,sell:22,c:0xf08020,ic:"🥕"},pumpkin:{t:65,cost:20,sell:60,c:0xe86a10,ic:"🎃"}};
const TOOLS=[["hoe","⛏️ Hoe"],["water","💧 Water"],["harvest","✂️ Harvest"],["wheat","🌾 3"],["carrot","🥕 8"],["pumpkin","🎃 20"],["feed","🌿 Feed"],["milk","🥛 Milk"],["collect","🥚 Eggs/Clean"],["fish","🎣 Fish"],["gun","🔫 Gun"]];
let camP=.8,camZ=1,pt="hoe",tool="hoe",money=30,time=0,keys={},camA=0.6,tiles=[],msgT;
const $=id=>document.getElementById(id);
function toast(s){sfxMsg(s);const e=$("toast");e.textContent=s;e.style.opacity=1;clearTimeout(msgT);msgT=setTimeout(()=>e.style.opacity=0,1400)}
const bar=$("bar");new ResizeObserver(()=>document.documentElement.style.setProperty("--bh",bar.offsetHeight+"px")).observe(bar);
TOOLS.forEach(([k,l],i)=>{const b=document.createElement("button");b.textContent=CROPS[k]?l.replace(" "," $"):l;b.onclick=()=>sel(k==="gun"&&tool==="gun"?pt:k);b.dataset.t=k;bar.appendChild(b)});
function sel(k){if(k!=="gun")pt=k;tool=k;[...bar.children].forEach(b=>b.classList.toggle("on",b.dataset.t===k))}sel("hoe");

const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
document.body.prepend(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(55,1,.1,300);
let camD=10,vw=innerWidth,vh=innerHeight,vl=0,vt=0,wide=false,drv=false;
function rs(){let w=innerWidth,h=innerHeight;if(wide){if(w/h>16/9)w=h*16/9;else h=w*9/16}
R.setSize(w,h);vl=(innerWidth-w)/2;vt=(innerHeight-h)/2;R.domElement.style.left=vl+"px";R.domElement.style.top=vt+"px";vw=w;vh=h;C.aspect=w/h;C.fov=C.aspect<1?80:55;camD=C.aspect<1?15:10;C.updateProjectionMatrix()}
addEventListener("resize",rs);rs();$("ar").onclick=()=>{wide=!wide;rs()};
const amb=new THREE.HemisphereLight(0xffffff,0x446633,.6),sun=new THREE.DirectionalLight(0xffffff,.9);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);const sc=sun.shadow.camera;sc.left=sc.bottom=-30;sc.right=sc.top=30;sc.far=100;
S.add(amb,sun,sun.target);
const M=(c)=>new THREE.MeshLambertMaterial({color:c});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),M(0x4f9a3a));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);
function add(g,m,x,y,z,sh=true){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=sh;o.receiveShadow=true;S.add(o);return o}

// tiles
const tm=[];
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
 const x=(i-N/2+.5)*T,z=(j-N/2+.5)*T-4;
 const m=add(new THREE.BoxGeometry(T-.15,.2,T-.15),M(0x5fae42),x,.1,z,false);
 const t={m,x,z,s:0,wet:0,crop:null,g:0};m.userData.t=t;tiles.push(t);tm.push(m)}
function tcol(t){t.m.material.color.setHex(t.s?(t.wet>0?0x3a2412:0x6b4423):0x5fae42)}

// decor
const colls=[],hayObjs=[],henObjs=[];let hay=3,curTag=null,fN=-14,pE=25,zS=2;const fences={};
function buildFence(tag,fn){(fences[tag]||[]).forEach(o=>S.remove(o));for(let i=colls.length-1;i>=0;i--)if(colls[i].tag===tag)colls.splice(i,1);curTag=tag;const n0=S.children.length;fn();fences[tag]=S.children.slice(n0);curTag=null}
function fieldF(){fenceLine(-10,6.5,10,6.5,3,4);fenceLine(10,6.5,10,fN);fenceLine(10,fN,-10,fN);fenceLine(-10,fN,-10,6.5)}
function pastF(){fenceLine(11,2,pE,2,2);fenceLine(pE,2,pE,-11);fenceLine(pE,-11,11,-11);fenceLine(11,-11,11,2)}
function yardF(){fenceLine(-24,zS,-13,zS,2);fenceLine(-13,zS,-13,-6);fenceLine(-13,-6,-24,-6);fenceLine(-24,-6,-24,zS)}
function gable(cx,cz,w,d,y,h,col){const s=new THREE.Shape();s.moveTo(-d/2,0);s.lineTo(d/2,0);s.lineTo(0,h);s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth:w,bevelEnabled:false});g.translate(0,0,-w/2);const m=add(g,M(col),cx,y,cz);m.rotation.y=Math.PI/2;return m}
function wall(x1,z1,x2,z2){colls.push({x1,z1,x2,z2,tag:curTag})}
function zone(x,z){return x>-30&&x<30&&z>-20&&z<16}
function blocked(x,z,r){return !noclip&&colls.some(c=>x>c.x1-r&&x<c.x2+r&&z>c.z1-r&&z<c.z2+r)}
const FM=M(0x8a6a40);
function fenceLine(ax,az,bx,bz,gi=-9,gw=2){const L=Math.hypot(bx-ax,bz-az),n=Math.ceil(L/2),ux=(bx-ax)/L,uz=(bz-az)/L,ang=Math.atan2(ux,uz),sl=L/n;
for(let i=0;i<=n;i++){if(i>gi&&i<gi+gw)continue;add(new THREE.BoxGeometry(.2,1.1,.2),FM,ax+ux*sl*i,.55,az+uz*sl*i)}
for(let i=0;i<n;i++){if(i>=gi&&i<gi+gw)continue;const x0=ax+ux*sl*i,z0=az+uz*sl*i,x1=x0+ux*sl,z1=z0+uz*sl;
[.4,.8].forEach(y=>{const r=add(new THREE.BoxGeometry(.07,.09,sl),FM,(x0+x1)/2,y,(z0+z1)/2);r.rotation.y=ang});
wall(Math.min(x0,x1)-.15,Math.min(z0,z1)-.15,Math.max(x0,x1)+.15,Math.max(z0,z1)+.15)}}
// hollow barn with a door, hay and a lantern
const WM=new THREE.MeshLambertMaterial({color:0xb33a2e,transparent:true,opacity:1});
function bw(cx,cz,w,d){add(new THREE.BoxGeometry(w,5,d),WM,cx,2.5,cz);wall(cx-w/2,cz-d/2,cx+w/2,cz+d/2)}
bw(-16,-15,8,.4);bw(-20,-12,.4,6);bw(-12,-12,.4,6);bw(-18.7,-9,2.7,.4);bw(-13.3,-9,2.7,.4);
add(new THREE.BoxGeometry(2.8,1.8,.4),WM,-16,4.1,-9);
add(new THREE.BoxGeometry(7.6,.1,5.6),M(0x9a7a4a),-16,.06,-12,false);
[[-18.8,-14],[-17.2,-14],[-18.8,-12.6]].forEach(([x,z])=>{const b=add(new THREE.BoxGeometry(1.4,1,1.2),M(0xd9b84a),x,.55,z);hayObjs.push(b);wall(x-.7,z-.6,x+.7,z+.6)});
hayObjs.push(add(new THREE.BoxGeometry(1.4,1,1.2),M(0xd9b84a),-18.8,1.55,-14));
add(new THREE.BoxGeometry(1.2,1,2.6),M(0x6b4a2a),-13,.55,-13.3);wall(-13.6,-14.6,-12.4,-12);
[[-14.5,-14.2],[-15.8,-14.2]].forEach(([x,z])=>{add(new THREE.BoxGeometry(1,1,1),M(0xa07a48),x,.55,z);wall(x-.5,z-.5,x+.5,z+.5)});
const lamp=new THREE.PointLight(0xffd9a0,.9,12);lamp.position.set(-16,3.5,-12);S.add(lamp);add(new THREE.SphereGeometry(.2,8,6),new THREE.MeshBasicMaterial({color:0xffe0a0}),-16,3.5,-12,false);
// chicken yard + coop house
buildFence("yard",yardF);
add(new THREE.BoxGeometry(3,2,2.4),M(0xc9a36a),-21.5,1,-4.5);const cr=add(new THREE.ConeGeometry(2.4,1.2,4),M(0x7a2a1a),-21.5,2.6,-4.5);cr.rotation.y=Math.PI/4;wall(-23,-5.7,-20,-3.3);
const roof=gable(-16,-12,8.8,7,5,2.6,0x5a2a1a);

for(let k=0;k<26;k++){const a=Math.random()*6.28,r=22+Math.random()*30,x=Math.cos(a)*r,z=Math.sin(a)*r-4;if(zone(x,z)||Math.hypot(x+16,z-20)<9||(z>15&&z<25&&x>-10))continue;
 add(new THREE.CylinderGeometry(.35,.45,2.4,6),M(0x6b4a2a),x,1.2,z);add(new THREE.ConeGeometry(2,4.5,7),M(0x2d7a35),x,4.4,z);wall(x-.5,z-.5,x+.5,z+.5)}
buildFence("field",fieldF);
const chick=[];for(let k=0;k<5;k++){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(.5,.4,.7),M(0xfafafa)),h=new THREE.Mesh(new THREE.BoxGeometry(.25,.3,.25),M(0xe03030));
 b.position.y=.4;h.position.set(0,.7,.35);g.add(b,h);g.position.set(-19+Math.random()*5,0,-5+Math.random()*6);const em=new THREE.Mesh(new THREE.SphereGeometry(.2,8,6),M(0xfff2cc));em.position.y=1.15;em.visible=false;g.add(em);g.userData={a:0,tx:g.position.x,tz:g.position.z,hen:{g,fed:0,egg:0,em}};S.add(g);chick.push(g);henObjs.push(g)}

// player
const P=new THREE.Group();
[[new THREE.BoxGeometry(.7,.9,.45),0x2f6fd0,.95],[new THREE.SphereGeometry(.28,12,10),0xf0c8a0,1.65],[new THREE.CylinderGeometry(.5,.5,.06,14),0xe8c860,1.88],[new THREE.CylinderGeometry(.28,.3,.2,12),0xe8c860,1.98],[new THREE.BoxGeometry(.5,.45,.4),0x4a3a2a,.28]].forEach(([g,c,y])=>{const m=new THREE.Mesh(g,M(c));m.position.y=y;m.castShadow=true;P.add(m)});
P.position.set(0,0,9);S.add(P);

// crops
function mkCrop(type,t){
 const g=new THREE.Group(),mat=M(0x4a9a3a);g.userData={type,mat};
 if(type==="wheat")for(let k=0;k<7;k++){const s=new THREE.Mesh(new THREE.BoxGeometry(.07,1,.07),mat);s.position.set((Math.random()-.5)*1.3,.5,(Math.random()-.5)*1.3);g.add(s)}
 if(type==="carrot")for(let k=0;k<4;k++){const s=new THREE.Mesh(new THREE.ConeGeometry(.2,.9,5),mat);s.position.set((k%2-.5)*.7,.45,(k>>1)*.7-.35);g.add(s)}
 if(type==="pumpkin"){const s=new THREE.Mesh(new THREE.SphereGeometry(.55,12,10),mat);s.scale.y=.75;s.position.y=.4;g.add(s);const st=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,.25,5),M(0x3a6a2a));st.position.y=.85;g.add(st)}
 g.children.forEach(c=>c.castShadow=true);g.position.set(t.x,.2,t.z);S.add(g);return g}
const green=new THREE.Color(0x4a9a3a);
function grow(t,dt){if(!t.crop||t.wet<=0)return;const d=CROPS[t.crop.userData.type];t.g=Math.min(1,t.g+dt*GM()/d.t)}
function showCrop(t){if(!t.crop)return;const g=t.crop,d=CROPS[g.userData.type];g.scale.set(.5+.5*t.g,.25+.75*t.g,.5+.5*t.g);g.userData.mat.color.lerpColors(green,new THREE.Color(d.c),Math.max(0,(t.g-.6)/.4));if(t.giant)g.scale.multiplyScalar(1.8)}

// actions
function act(t){
 if(Math.hypot(t.x-P.position.x,t.z-P.position.z)>7)return toast("Too far - walk closer");
 if(tool==="hoe"){if(t.crop)return toast("Crop is growing here");if(t.s)return toast("Already tilled");t.s=1;tcol(t);sfx("dig")}
 else if(tool==="water"){if(!t.s)return toast("Till the soil first");t.wet=30;tcol(t);sfx("water")}
 else if(tool==="harvest"){if(!t.crop)return toast("Nothing to harvest");if(t.g<1)return toast("Not ripe yet");const d=CROPS[t.crop.userData.type],gi=t.giant,v=Math.round(d.sell*PM()*(gi?3:1));money+=v;toast("Sold for $"+v+" "+d.ic+(gi?" (giant!)":""));S.remove(t.crop);t.crop=null;t.g=0;t.giant=0;if(gi&&!won.fair){won.fair=1;startCut("fair")}}
 else if(CROPS[tool]){const d=CROPS[tool];if(!t.s)return toast("Till the soil first");if(t.crop)return toast("Occupied");if(money<d.cost)return toast("Not enough money");money-=d.cost;t.crop=mkCrop(tool,t);t.g=0;showCrop(t);sfx("plant")}
}
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
let dn=null;const cv=R.domElement;
cv.addEventListener("pointerdown",e=>{dn={x:e.clientX,y:e.clientY,t:performance.now(),px:e.clientX,py:e.clientY,b:e.button}});

<script>
/* ===== SOUND MENU + PROCEDURAL MUSIC + CENTERED CLOCK ===== */
(function(){
const $=id=>document.getElementById(id);
const css=document.createElement("style");css.textContent=
"#top{display:grid!important;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}#money{grid-column:1;grid-row:1;justify-self:start}#clock{grid-column:2;grid-row:2;justify-self:center;text-align:center;white-space:nowrap}#top>span{grid-column:3;grid-row:1;justify-self:end;flex-wrap:wrap;justify-content:flex-end}#stats{position:static!important;grid-column:1;grid-row:2;justify-self:start}#shb{position:static!important;grid-column:3;grid-row:2;justify-self:end;pointer-events:auto}"+

"body.cutting #sndp{display:none!important}";document.head.appendChild(css);

const V={sfx:1,mus:.6,msfx:0,mmus:0};try{Object.assign(V,JSON.parse(localStorage.getItem("fs_snd")))}catch(e){}

function apply(){mute=!!V.msfx;$("mu").textContent=V.msfx&&V.mmus?"🔇":"🔊";if(!AC)return;if(mG)mG.gain.value=V.msfx?0:V.sfx;
 if(mus){const t=V.mmus||cut?0:V.mus*.5;if(t!==lastTarget){lastTarget=t;mus.gain.setTargetAtTime(t,AC.currentTime,.25)}}}

["pointerdown","keydown"].forEach(e=>addEventListener(e,setup));
// music: soft folk loop (plucks, bass, pad, random pentatonic melody); minor + slower at night and in winter
const nt=(m,t,d,ty,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mus);o.start(t);o.stop(t+d+.05)};
const DAY=[[48,[0,4,7]],[45,[0,3,7]],[41,[0,4,7]],[43,[0,4,7]]],NIGHT=[[45,[0,3,7]],[41,[0,4,7]],[48,[0,4,7]],[40,[0,3,7]]],PENT=[69,72,74,76,79,81,84],ARP=[0,1,2,1,2,1,2,1];let mi=3;
function play(t,s,minor){const [root,ch]=(minor?NIGHT:DAY)[bar%4];
 if(s===0){ch.forEach(i=>nt(root+24+i,t,3.2,"sine",.035));nt(root,t,2.4,"sine",.12)}
 if(s===4)nt(root+7,t,1.4,"sine",.08);
 nt(root+12+ch[ARP[s]],t,.9,"triangle",minor?.05:.07);
 if(Math.random()<(minor?.22:.4)){mi=Math.max(0,Math.min(PENT.length-1,mi+(Math.random()<.5?-1:1)*(Math.random()<.3?2:1)));nt(PENT[mi],t,1.1,"sine",.06)}}
setInterval(()=>{if(!AC||!mus||AC.state!=="running")return;apply();
 const hr=(7+time/150*24)%24,minor=hr>=19||hr<6||seas()===3,beat=minor?.5:.4;
 if(nextT<AC.currentTime-1)nextT=AC.currentTime+.1;
 while(nextT<AC.currentTime+1){play(nextT,stp,minor);nextT+=beat;if(++stp>=8){stp=0;bar++}}},120);
// sound menu
const p=document.createElement("div");p.id="sndp";p.style.cssText="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--hud);padding:14px;border-radius:14px;display:none;flex-direction:column;gap:12px;z-index:20;width:min(320px,88vw);font-size:14px";
p.innerHTML="<b style='font-size:16px'>🔊 Sound</b>";document.body.appendChild(p);
const refs=[],all=document.createElement("button");
const refAll=()=>{all.textContent=V.msfx&&V.mmus?"🔊 Unmute all":"🔇 Mute all"};
[["🎵 Music","mus","mmus"],["🔔 Sound effects","sfx","msfx"]].forEach(([l,k,m])=>{
 const d=document.createElement("div"),h=document.createElement("div"),b=document.createElement("button"),s=document.createElement("input");
 d.style.cssText="display:flex;flex-direction:column;gap:6px";h.style.cssText="display:flex;justify-content:space-between;align-items:center";h.innerHTML="<span>"+l+"</span>";
 s.type="range";s.min=0;s.max=100;s.style.width="100%";
 const ref=()=>{s.value=V[k]*100;b.textContent=V[m]?"🔇 Muted":"🔊 On";s.style.opacity=V[m]?.4:1;refAll()};
 s.oninput=()=>{V[k]=s.value/100;if(V[m]&&+s.value>0)V[m]=0;refs.forEach(f=>f());apply();save()};
 if(k==="sfx")s.onchange=()=>{if(AC&&!V.msfx)sfx("coin")};
 b.onclick=()=>{V[m]=V[m]?0:1;refs.forEach(f=>f());apply();save();if(k==="sfx"&&!V.msfx)sfx("coin")};
 refs.push(ref);ref();h.appendChild(b);d.append(h,s);p.appendChild(d)});
all.onclick=()=>{const both=V.msfx&&V.mmus;V.msfx=V.mmus=both?0:1;refs.forEach(f=>f());apply();save()};
const cl=document.createElement("button");cl.textContent="Close";cl.onclick=()=>p.style.display="none";p.append(all,cl);
$("mu").onclick=()=>{p.style.display=p.style.display==="flex"?"none":"flex"};
{const v=$("fxv");if(v&&v.parentNode)v.parentNode.remove()}
TUT.push(["Sound and music","Tap 🔊 (top right) for the sound menu: separate volume sliders and mute buttons for 🎵 music and 🔔 sound effects, plus Mute all. Music is generated live: it turns softer and minor at night and in winter, and is silent during cutscenes."]);
{const t=$("top");t.appendChild($("stats"));t.appendChild($("shb"))}
apply();
})();
