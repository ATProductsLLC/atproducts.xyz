function help(){show('<h1>Welcome to Haul Sim 3D</h1><p>A little county. A big rig. Build your own hauling business.</p><h2>Your first delivery</h2><p>1. Open Dispatch and accept a contract.<br>2. Follow the yellow minimap route to the pickup bay.<br>3. Stop in the glowing ring and press F to load.<br>4. Drive to the delivery bay and press F again to get paid.</p><h2>Driving</h2><p>W / Up accelerates. S / Down brakes, then reverses. A / D steers; Space holds the parking brake. Touch buttons support simultaneous steering and throttle. Trailers swing wide and can jackknife in reverse. Roads have right-hand traffic; collisions damage truck and cargo. Grass slows you down.</p><h2>Roadside services</h2><p>Stop near a marked fuel station, motel, or garage and press F. Fuel costs $5 per unit. Rest costs $80 and advances the clock by 8 hours. Repairs cost $30 per damage point. Garage upgrades improve power, capacity, and steering. R offers a paid recovery if you get stuck; emergency credit keeps recovery available.</p><h2>Camera & progress</h2><p>C cycles chase, high, and cab views. Drag to orbit; scroll to zoom; Q/E rotate. L toggles lights. P or Escape pauses. Panels pause the world. Progress autosaves every 15 seconds when browser storage is available. The HTML needs internet to load Three.js.</p><div class="footer"><button onclick="closePanel()">Start hauling</button><button onclick="dispatch()">Open Dispatch</button></div>')}

let currentService=null;window.buyService=k=>{if(!currentService)return;let cost=k==='fuel'?Math.ceil((maxFuel()-state.fuel)*5):k==='repair'?Math.ceil((100-state.health)*30):80;if(state.money<cost)return toast('Not enough cash. Deliver a load or use recovery.');state.money-=cost;if(k==='fuel')state.fuel=maxFuel();if(k==='repair')state.health=100;if(k==='rest'){state.energy=100;state.time+=480}save();service(currentService)};window.upgrade=k=>{if(!['engine','tank','handling'].includes(k)||state.up[k]>=3)return;const cost=1500+state.up[k]*1500;if(state.money<cost)return toast('Not enough cash for this upgrade.');state.money-=cost;state.up[k]++;save();service(currentService)};
function interact(){if(!parked())return toast('Stop the truck first.');if(state.job){const j=state.job,d=depots[j.stage==='pickup'?j.from:j.to];if(dist(d.bay.x,d.bay.z)<13){if(j.stage==='pickup'){j.stage='delivery';syncTrailer(true);toast('Trailer attached. Take wide turns and protect your cargo.')}else{const late=state.time>j.due,mult=(.5+.5*j.condition/100)*(late?.7:1),pay=Math.round(j.pay*mult);state.money+=pay;state.completed++;state.earned+=pay;state.job=null;syncTrailer();generateOffers();toast('Delivered! +'+cash(pay)+(late?' · Late penalty applied':' · On time'))}save();return}}const s=services.find(s=>dist(s.x,s.z)<23);if(s){currentService=s;service(s)}else toast('Stop in a loading bay or beside a service station to interact.')}

const traffic=[];function trafficCar(i){const g=new THREE.Group();box(g,2.2,.7,4.2,[0xf2e0b1,0x417da3,0xd95842,0xeeeeee][i%4],0,.85,0);box(g,1.9,.7,2.1,0x344c5d,0,1.5,-.1);for(const x of [-1.1,1.1])for(const z of [-1.3,1.3])wheel(g,x,z,.42,.45);scene.add(g);return g}

function updateTraffic(dt){for(const c of traffic){let a=c.path[c.seg],b=c.path[(c.seg+1)%4];let blocked=false;const px=a.x+(b.x-a.x)*c.t,pz=a.z+(b.z-a.z)*c.t,dx=b.x-a.x,dz=b.z-a.z,len=Math.hypot(dx,dz);const ahead=((state.x-px)*dx+(state.z-pz)*dz)/len,side=Math.abs((state.x-px)*dz-(state.z-pz)*dx)/len;if(ahead>0&&ahead<19&&side<4)blocked=true;if(!blocked)c.t+=dt*c.sp/len;if(c.t>=1){c.t-=1;c.seg=(c.seg+1)%4;a=c.path[c.seg];b=c.path[(c.seg+1)%4]}c.g.position.set(a.x+(b.x-a.x)*c.t,0,a.z+(b.z-a.z)*c.t);c.g.rotation.y=Math.atan2(b.x-a.x,b.z-a.z)}}

function targetDepot(){if(!state.job)return depots[0];return depots[state.job.stage==='pickup'?state.job.from:state.job.to]}

const mapCtx=$('map').getContext('2d');function drawMap(){const ctx=mapCtx,w=356,scale=.52,offset=178;ctx.clearRect(0,0,w,w);ctx.fillStyle='#264732';ctx.fillRect(0,0,w,w);const p=(x,z)=>[offset+x*scale,offset+z*scale];ctx.lineWidth=9;ctx.strokeStyle='#737c76';for(const v of roadLines){ctx.beginPath();ctx.moveTo(...p(v,-325));ctx.lineTo(...p(v,325));ctx.stroke();ctx.beginPath();ctx.moveTo(...p(-325,v));ctx.lineTo(...p(325,v));ctx.stroke()}const d=targetDepot();if(state.job){ctx.strokeStyle='#f4c430';ctx.lineWidth=3;ctx.beginPath();routeTo(d.bay.x,d.bay.z).forEach((v,i)=>{const a=p(v.x,v.z);i?ctx.lineTo(...a):ctx.moveTo(...a)});ctx.stroke()}for(const v of depots){ctx.fillStyle=v===d&&state.job?'#f4c430':'#dfd7b8';const [x,y]=p(v.bay.x,v.bay.z);ctx.fillRect(x-4,y-4,8,8)}for(const s of services){ctx.fillStyle=s.type==='fuel'?'#77daea':s.type==='rest'?'#e6a0ef':'#eaa35a';const[x,y]=p(s.x,s.z);ctx.beginPath();ctx.arc(x,y,4,0,TAU);ctx.fill()}const [x,y]=p(state.x,state.z);ctx.save();ctx.translate(x,y);ctx.rotate(-state.angle);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,9);ctx.lineTo(-6,-7);ctx.lineTo(6,-7);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.fillText('N',12,23);ctx.font='12px system-ui';ctx.fillText('COUNTY / GPS',12,341)}
